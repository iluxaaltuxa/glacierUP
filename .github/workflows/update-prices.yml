name: Update prices

on:
  schedule:
    - cron: "17 */6 * * *"   # каждые 6 часов
  workflow_dispatch:         # кнопка «Run workflow» вручную

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download Skinport prices
        run: node update-prices.mjs
      - name: Commit prices.js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.js
          git commit -m "Update prices" || exit 0
          git push
